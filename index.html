<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скоро</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap');

  :root{
    --bg:#000000;
    --ink:#ffffff;
    --muted:#8a8a8a;
    --line:rgba(255,255,255,.14);
    --red:#e30613;
    --red-dim:rgba(227,6,19,.35);
    --blue:#0a5cff;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--bg);
    font-family:'JetBrains Mono', 'Space Mono', ui-monospace, monospace;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    color:var(--ink);
  }

  /* faint dot-grid texture across the whole screen, a la Nothing's back panel */
  .dotgrid{
    position:absolute;
    inset:0;
    z-index:0;
    background-image:radial-gradient(circle, rgba(255,255,255,.14) 1px, transparent 1px);
    background-size:22px 22px;
    -webkit-mask-image:radial-gradient(circle at 50% 45%, rgba(0,0,0,.9) 0%, transparent 70%);
    mask-image:radial-gradient(circle at 50% 45%, rgba(0,0,0,.9) 0%, transparent 70%);
    pointer-events:none;
  }

  /* animated network of connected dots in the background */
  .network{
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;
  }

  /* center content */
  .stage{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    padding:0 24px;
    text-align:center;
  }

  .title-wrap{
    position:relative;
  }
  .title{
    margin:0;
    font-family:'JetBrains Mono', monospace;
    font-size:clamp(46px, 13vw, 96px);
    font-weight:800;
    line-height:1;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink);
    display:inline-block;
    animation:popIn 1.1s cubic-bezier(.16,.8,.3,1) both, titleFloat 4.6s ease-in-out 1.1s infinite;
  }
  .title .glyph-dot{
    display:inline-block;
    color:var(--ink);
    animation:dotPulse 1.8s ease-in-out infinite;
  }
  .title .glyph-dot:nth-of-type(1){animation-delay:0s;}
  .title .glyph-dot:nth-of-type(2){animation-delay:.18s;}
  .title .glyph-dot:nth-of-type(3){animation-delay:.36s;}
  @keyframes dotPulse{
    0%,60%,100%{transform:translateY(0); opacity:.55;}
    30%{transform:translateY(-4px); opacity:1;}
  }
  @keyframes popIn{
    0%{opacity:0; letter-spacing:.16em; filter:blur(2px);}
    100%{opacity:1; letter-spacing:.06em; filter:blur(0);}
  }
  @keyframes glowBreathe{
    0%,100%{text-shadow:0 0 0 rgba(255,255,255,0);}
    50%{text-shadow:0 0 24px rgba(255,255,255,.35);}
  }
  @keyframes titleFloat{
    0%,100%{transform:translateY(0); text-shadow:0 0 0 rgba(255,255,255,0);}
    50%{transform:translateY(-3px); text-shadow:0 0 16px rgba(255,255,255,.25);}
  }

  .sub{
    margin:0;
    max-width:340px;
    color:var(--muted);
    font-size:13px;
    letter-spacing:.04em;
    line-height:1.7;
    animation:fadeDown 1s .15s ease both;
  }
  .sub b{color:var(--ink); font-weight:500;}
  @keyframes fadeDown{
    from{opacity:0; transform:translateY(-10px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ring centered behind content, dashed like a glyph indicator */
  .ring{
    position:absolute;
    top:50%; left:50%;
    width:440px; height:440px;
    border-radius:50%;
    border:1px dashed var(--line);
    animation:rotateRing 32s linear infinite;
    z-index:1;
  }
  .ring::before, .ring::after{
    content:"";
    position:absolute;
    width:18px; height:18px;
    border-radius:50%;
    top:-9px; left:50%;
    transform:translateX(-50%);
  }
  .ring::before{
    background:var(--red);
    box-shadow:0 0 20px var(--red);
  }
  .ring::after{
    top:auto; bottom:-9px;
    background:var(--blue);
    box-shadow:0 0 20px var(--blue);
  }
  @keyframes rotateRing{
    from{transform:translate(-50%,-50%) rotate(0deg);}
    to{transform:translate(-50%,-50%) rotate(360deg);}
  }

  /* button */
  .ticket-wrap{
    position:relative;
    margin-top:8px;
    display:flex;
    justify-content:center;
    z-index:3;
    animation:fadeUp 1s .35s cubic-bezier(.25,.7,.3,1) both;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  .ticket-btn{
    position:relative;
    border:1px solid var(--ink);
    cursor:pointer;
    padding:16px 48px;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    font-weight:700;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--ink);
    background:transparent;
    border-radius:999px;
    overflow:hidden;
    transition:color .25s ease, background .25s ease, border-color .25s ease, transform .12s ease;
  }
  .ticket-btn::before{
    content:"";
    position:absolute;
    inset:0;
    background:var(--red);
    transform:translateX(-101%);
    transition:transform .3s ease;
    z-index:-1;
  }
  .ticket-btn:hover{
    border-color:var(--red);
  }
  .ticket-btn:hover::before{
    transform:translateX(0);
  }
  .ticket-btn:active{
    transform:scale(.96);
  }
  .ticket-btn:disabled{
    opacity:.35;
    cursor:default;
  }
  .ticket-btn:disabled:hover{
    border-color:var(--ink);
  }
  .ticket-btn:disabled:hover::before{
    transform:translateX(-101%);
  }
  .ticket-btn .btn-label{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .spinner{
    width:13px; height:13px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.25);
    border-top-color:var(--ink);
    animation:spin .8s linear infinite;
    display:none;
    flex:none;
  }
  .ticket-btn.loading .spinner{
    display:inline-block;
  }
  @keyframes spin{
    to{transform:rotate(360deg);}
  }

  /* ticket reveal panel — drops down after the button is pressed */
  .reveal{
    max-height:0;
    opacity:0;
    overflow:hidden;
    width:min(320px, 84vw);
    transition:max-height .6s cubic-bezier(.25,.7,.3,1), opacity .5s ease, margin-top .6s ease;
    margin-top:0;
  }
  .reveal.show{
    max-height:320px;
    opacity:1;
    margin-top:6px;
    animation:dropIn .7s cubic-bezier(.25,.7,.3,1) both;
  }
  @keyframes dropIn{
    0%{transform:translateY(-14px); opacity:0;}
    100%{transform:translateY(0); opacity:1;}
  }
  .reveal-inner{
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px 20px;
    background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0));
    position:relative;
  }
  .reveal-inner::before{
    content:"";
    position:absolute;
    top:-1px; left:50%;
    transform:translateX(-50%);
    width:34px; height:2px;
    background:var(--red);
    box-shadow:0 0 10px var(--red);
  }
  .reveal-label{
    font-size:11px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
  }
  .reveal-number{
    font-family:'JetBrains Mono', monospace;
    font-size:clamp(17px, 4.6vw, 22px);
    font-weight:700;
    letter-spacing:.04em;
    color:var(--ink);
    text-shadow:0 0 18px rgba(255,255,255,.25);
    white-space:nowrap;
  }
  .reveal-number .num-digit{
    display:inline-block;
    animation:digitSettle .45s cubic-bezier(.25,.7,.3,1) both;
  }
  @keyframes digitSettle{
    0%{transform:translateY(-6px); opacity:0;}
    100%{transform:translateY(0); opacity:1;}
  }
  .reveal-number .num-sep{
    display:inline-block;
    color:var(--muted);
    padding:0 2px;
  }
  .reveal-text{
    margin:14px 0 0;
    font-size:12px;
    line-height:1.7;
    color:var(--muted);
    letter-spacing:.01em;
  }

  /* corner brackets, framing the stage like a viewfinder */
  .bracket{
    position:absolute;
    width:18px; height:18px;
    border-color:var(--line);
    border-style:solid;
    z-index:2;
  }
  .bracket.tl{top:26px; left:26px; border-width:1px 0 0 1px;}
  .bracket.tr{top:26px; right:26px; border-width:1px 1px 0 0;}
  .bracket.bl{bottom:26px; left:26px; border-width:0 0 1px 1px;}
  .bracket.br{bottom:26px; right:26px; border-width:0 1px 1px 0;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

  <div class="dotgrid"></div>
  <canvas class="network" id="network"></canvas>

  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>

  <div class="stage">
    <div class="ring"></div>

    <div class="title-wrap">
      <h1 class="title">Скоро<span class="glyph-dot">.</span><span class="glyph-dot">.</span><span class="glyph-dot">.</span></h1>
    </div>

    <p class="sub">Готовим что-то крупное.<br><b>Держи билет наготове</b> — уведомим первым.</p>

    <div class="ticket-wrap">
      <button class="ticket-btn" id="ticketBtn">
        <span class="btn-label">
          <span class="spinner"></span>
          <span class="btn-text" id="btnText">Билет</span>
        </span>
      </button>
    </div>

    <div class="reveal" id="reveal">
      <div class="reveal-inner">
        <div class="reveal-label" id="revealLabel">Ваш билет</div>
        <div class="reveal-number" id="revealNumber">#000000</div>
        <p class="reveal-text" id="revealText">Этот номер уже ждёт вас внутри бота.<br>Когда откроем доступ — он станет вашим ключом. Никому не показывайте раньше времени.</p>
      </div>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  const canvas = document.getElementById('network');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W, H, DPR;
  let nodes = [];

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function initNodes(){
    const area = W * H;
    const count = Math.max(28, Math.min(90, Math.round(area / 22000)));
    nodes = Array.from({length: count}, (_, i) => {
      const roll = Math.random();
      return {
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.18,
        vy: (Math.random() - 0.5) * 0.18,
        r: 1 + Math.random() * 1.2,
        color: roll < 0.08 ? 'red' : (roll < 0.16 ? 'blue' : 'white')
      };
    });
  }

  const LINK_DIST = 150;

  function step(){
    ctx.clearRect(0, 0, W, H);

    for(const n of nodes){
      n.x += n.vx;
      n.y += n.vy;
      if(n.x < 0 || n.x > W) n.vx *= -1;
      if(n.y < 0 || n.y > H) n.vy *= -1;
      n.x = Math.max(0, Math.min(W, n.x));
      n.y = Math.max(0, Math.min(H, n.y));
    }

    for(let i = 0; i < nodes.length; i++){
      for(let j = i + 1; j < nodes.length; j++){
        const a = nodes[i], b = nodes[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < LINK_DIST){
          const alpha = (1 - dist / LINK_DIST) * 0.3;
          let stroke = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
          if(a.color === 'red' && b.color === 'red') stroke = 'rgba(227,6,19,' + (alpha * 1.4).toFixed(3) + ')';
          else if(a.color === 'blue' && b.color === 'blue') stroke = 'rgba(10,92,255,' + (alpha * 1.4).toFixed(3) + ')';
          ctx.strokeStyle = stroke;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    for(const n of nodes){
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = n.color === 'red' ? 'rgba(227,6,19,.9)'
        : n.color === 'blue' ? 'rgba(10,92,255,.9)'
        : 'rgba(255,255,255,.55)';
      ctx.fill();
    }

    if(!reduceMotion) requestAnimationFrame(step);
  }

  function start(){
    resize();
    initNodes();
    step();
  }

  window.addEventListener('resize', () => {
    resize();
    initNodes();
    if(reduceMotion) step();
  });

  start();

  // ====== НАСТРОЙКА FIREBASE ======
  // 1. Создай проект на https://console.firebase.google.com (бесплатно)
  // 2. Firestore Database → Create database → любой регион, начни в тестовом режиме
  // 3. Project settings → General → "Your apps" → Web app → скопируй конфиг ниже
  // 4. В Firestore → Rules вставь правила (см. инструкцию в чате) и Publish
  const firebaseConfig = {
    apiKey: "ВСТАВЬ_СЮДА",
    authDomain: "ВСТАВЬ_СЮДА.firebaseapp.com",
    projectId: "ВСТАВЬ_СЮДА",
    storageBucket: "ВСТАВЬ_СЮДА.appspot.com",
    messagingSenderId: "ВСТАВЬ_СЮДА",
    appId: "ВСТАВЬ_СЮДА"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const TICKETS = db.collection('tickets');

  // ticket reveal logic
  const ticketBtn = document.getElementById('ticketBtn');
  const btnText = document.getElementById('btnText');
  const reveal = document.getElementById('reveal');
  const revealNumber = document.getElementById('revealNumber');
  const revealLabel = document.getElementById('revealLabel');
  const revealText = document.getElementById('revealText');

  const LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; // no I/O to avoid confusion with 1/0
  const randDigit = () => Math.floor(Math.random() * 10).toString();
  const randLetter = () => LETTERS[Math.floor(Math.random() * LETTERS.length)];

  // format: 000-xxx-0x0-x0x
  function genTicketGroups(){
    return [
      randDigit() + randDigit() + randDigit(),
      randLetter() + randLetter() + randLetter(),
      randDigit() + randLetter() + randDigit(),
      randLetter() + randDigit() + randLetter()
    ];
  }
  const groupsToString = groups => groups.join('-');
  const stringToGroups = str => str.split('-');

  function renderTicket(groupsOrString){
    const groups = Array.isArray(groupsOrString) ? groupsOrString : stringToGroups(groupsOrString);
    let i = 0;
    const parts = groups.map(group =>
      group.split('').map(ch => {
        const span = '<span class="num-digit" style="animation-delay:' + (i * 0.05) + 's">' + ch + '</span>';
        i++;
        return span;
      }).join('')
    );
    revealNumber.innerHTML = parts.join('<span class="num-sep">-</span>');
  }

  function getTelegramUser(){
    const tg = window.Telegram && window.Telegram.WebApp;
    if(tg){
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
      if(user && user.id) return String(user.id);
    }
    return null;
  }

  async function getVisitorIp(){
    try{
      const res = await fetch('https://api.ipify.org?format=json');
      const data = await res.json();
      return data.ip;
    }catch(e){
      return null;
    }
  }

  function showState(kind, ticketString){
    if(kind === 'new'){
      revealLabel.textContent = 'Ваш билет';
      renderTicket(ticketString);
      revealText.innerHTML = 'Этот номер уже ждёт вас внутри бота.<br>Когда откроем доступ — он станет вашим ключом. Никому не показывайте раньше времени.';
      btnText.textContent = 'Билет получен';
    } else if(kind === 'own'){
      revealLabel.textContent = 'Билет уже получен';
      renderTicket(ticketString);
      revealText.innerHTML = 'Вы уже забирали билет раньше.<br>Он никуда не делся и всё ещё в силе — просто дождитесь открытия.';
      btnText.textContent = 'Билет уже у вас';
    } else if(kind === 'ip'){
      revealLabel.textContent = 'Билет уже выдан';
      revealNumber.textContent = '••• ••• ••• •••';
      revealText.innerHTML = 'С этой сети билет уже был получен другим аккаунтом.<br>На одну сеть — один билет. Дождитесь открытия доступа.';
      btnText.textContent = 'Уже выдан';
    } else if(kind === 'no-telegram'){
      revealLabel.textContent = 'Открой через бота';
      revealNumber.textContent = '—';
      revealText.innerHTML = 'Билеты выдаются только внутри Telegram-бота.<br>Открой эту страницу через кнопку в боте.';
      btnText.textContent = 'Билет';
    } else if(kind === 'error'){
      revealLabel.textContent = 'Не получилось';
      revealNumber.textContent = '—';
      revealText.innerHTML = 'Не удалось связаться с сервером.<br>Попробуйте ещё раз через пару секунд.';
      btnText.textContent = 'Билет';
    }
    reveal.classList.add('show');
  }

  ticketBtn.addEventListener('click', async () => {
    if(ticketBtn.disabled) return;

    ticketBtn.disabled = true;
    ticketBtn.classList.add('loading');
    btnText.textContent = 'Проверка…';

    const tgId = getTelegramUser();
    if(!tgId){
      ticketBtn.classList.remove('loading');
      showState('no-telegram');
      ticketBtn.disabled = false;
      return;
    }

    const ip = await getVisitorIp();

    try{
      // 1. свой аккаунт уже получал билет?
      const ownDoc = await TICKETS.doc(tgId).get();
      if(ownDoc.exists){
        ticketBtn.classList.remove('loading');
        showState('own', ownDoc.data().number);
        return;
      }

      // 2. с этого IP уже выдавали билет другому аккаунту?
      if(ip){
        const ipMatch = await TICKETS.where('ip', '==', ip).limit(1).get();
        if(!ipMatch.empty){
          ticketBtn.classList.remove('loading');
          showState('ip');
          return;
        }
      }

      // 3. чисто — выдаём новый билет
      const groups = genTicketGroups();
      const ticketString = groupsToString(groups);

      await TICKETS.doc(tgId).set({
        number: ticketString,
        ip: ip || null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      ticketBtn.classList.remove('loading');
      showState('new', ticketString);
    }catch(e){
      console.error(e);
      ticketBtn.classList.remove('loading');
      showState('error');
      ticketBtn.disabled = false;
    }
  });
</script>

</body>
</html>
